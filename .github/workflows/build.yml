name: Build and Push Docker Image

on:
  push:
    branches: [main]

# A run publishes an image and force-updates the deploy branch, so two in flight
# race over what ArgoCD ends up with. Only the newest commit's run matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: rhiza-research/kenya-forecasts

jobs:
  # applyPatch in server/ctrl/static.go returns nil on every failure path and the
  # caller then serves the unpatched original, so a patch that stops applying
  # drops the branding without an error, and one bad patch aborts the loop over
  # the rest. This builds the image, runs it, and fails if the injected import is
  # missing from the boot module, so a broken patch never reaches the registry.
  #
  # No bucket is involved. Filestash contacts the backend only when a session is
  # established, and everything asserted here is served straight off the embedded
  # filesystem and the plugin zip.
  validate:
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -f compose.local.yaml
      # compose derives this from the name: in compose.local.yaml.
      NETWORK: kenya-forecasts-local_default
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start the stack
        run: $COMPOSE up -d --build

      # The stack publishes no port, so every request comes from a container on
      # its network addressing the app by service name. That name is also
      # FILESTASH_HOST, which is what Filestash compares the request Host against.
      - name: Wait for it to serve
        run: |
          set -eu
          for i in $(seq 30); do
            if docker run --rm --network "$NETWORK" curlimages/curl:latest \
                 -fsS -o /dev/null http://app:8334/; then
              exit 0
            fi
            if [ -z "$($COMPOSE ps -q --status running app)" ]; then
              echo "the app exited before serving" >&2
              $COMPOSE logs
              exit 1
            fi
            sleep 2
          done
          echo "timed out waiting for the app to serve" >&2
          $COMPOSE logs
          exit 1

      # Two things are checked. That the branding patch applied, because
      # applyPatch returns nil on every failure path and its caller then serves
      # the unpatched original, so a patch that stops matching drops the branding
      # without an error. And that the bucket lists, which the asset checks alone
      # would not catch: with no backend that answers, /api/session reports the
      # session invalid and the connect page auto-submits forever while every
      # asset keeps returning 200.
      #
      # The X-Requested-With header is what SecureOrigin accepts in place of a
      # browser's own XHR marker. Without it every /api call is refused as an
      # intrusion attempt.
      #
      # Substring tests are shell case, not grep -q, and the sed pipeline ends in
      # tail rather than head: a reader that exits on its first match closes the
      # pipe early, and the writer then dies of SIGPIPE, which pipefail reports as
      # a failed pipeline even though the match succeeded.
      - name: Assert the branding applied and the bucket lists
        run: |
          docker run --rm -i --network "$NETWORK" --entrypoint /bin/sh \
            curlimages/curl:latest -s <<'SCRIPT'
          set -eu
          SITE=http://app:8334
          SENTINEL='../plugin/branding.zip/index.js'

          # BUILD_REF is in the served HTML as the asset path prefix.
          ref=$(curl -fsS "$SITE/" | sed -n 's|.*/assets/\([0-9a-f]\{7,\}\)/.*|\1|p' | tail -1)
          if [ -z "$ref" ]; then echo "could not read BUILD_REF from the page" >&2; exit 1; fi
          echo "BUILD_REF=$ref"

          boot=$(curl -fsS "$SITE/assets/$ref/boot/ctrl_boot_frontoffice.js")
          case "$boot" in
            *"$SENTINEL"*) ;;
            *) echo "branding patch did NOT apply: $SENTINEL absent from the boot module" >&2; exit 1 ;;
          esac
          crumb=$(curl -fsS "$SITE/assets/$ref/components/breadcrumb.js")
          case "$crumb" in
            *"word.length > 27"*) echo "breadcrumb patch did NOT apply: the title is still truncated" >&2; exit 1 ;;
          esac
          order=$(curl -fsS "$SITE/assets/$ref/pages/filespage/state_config.js")
          case "$order" in
            *'order: "desc"'*) ;;
            *) echo "sort order patch did NOT apply: the listing will be oldest first" >&2; exit 1 ;;
          esac
          curl -fsS -o /dev/null "$SITE/assets/$ref/plugin/branding.zip/index.js"
          curl -fsS -o /dev/null "$SITE/assets/$ref/plugin/branding.zip/kmsa-logo.jpg"
          curl -fsS -o /dev/null "$SITE/custom.css"
          echo "both patches applied and plugin assets are served"

          jar=$(mktemp)
          xhr='X-Requested-With: XmlHttpRequest'
          curl -fsS -c "$jar" -b "$jar" -H "$xhr" -o /dev/null "$SITE/"
          curl -fsS -c "$jar" -b "$jar" -H "$xhr" -o /dev/null -X POST \
            "$SITE/api/session/auth/?label=kenya-forecasts&state="
          listing=$(curl -fsS -c "$jar" -b "$jar" -H "$xhr" "$SITE/api/files/ls?path=%2F")
          echo "$listing"
          case "$listing" in
            *'"status": "ok"'*) ;;
            *) echo "listing failed, the connector did not reach the bucket" >&2; exit 1 ;;
          esac
          echo "the bucket lists through the s3 connector"
          SCRIPT

      - name: Logs
        if: always()
        run: $COMPOSE logs

  build:
    needs: [validate]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Update chart and push to deploy branch
        run: |
          sed -i 's/tag: .*/tag: ${{ github.sha }}/' chart/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chart/values.yaml
          git commit -m "Deploy ${{ github.sha }}"
          git push -f origin HEAD:deploy
